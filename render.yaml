services:
  - type: web
    name: ifab-flower-exchange
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_BASE_URL
        value: ""
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: SESSION_SAVE_PATH
        value: /tmp/ifab-sessions
